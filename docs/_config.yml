title: Suggest Bridge
description: >-
  Бот предложки для Telegram и Discord: отправьте идею, модераторы проверят,
  одобренное попадёт в канал или ленту сервера.
url: https://noki4angel37.github.io
baseurl: /suggest-bridge

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

logo: "/assets/logo.png"
favicon_ico: "/assets/logo.png"

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  GitHub:
    - "https://github.com/noki4angel37/suggest-bridge"
  Discord:
    - "https://discord.gg/F3fBdeTx94"

footer_content: >-
  <a href="https://github.com/noki4angel37/suggest-bridge">Suggest Bridge</a> ·
  <a href="https://discord.gg/F3fBdeTx94">Discord</a> ·
  <a href="https://github.com/noki4angel37/suggest-bridge/blob/main/LICENSE">MIT</a>

exclude:
  - wiki
  - WIKI.md
  - assets/screenshots-mockup.md
  - Gemfile
  - Gemfile.lock
