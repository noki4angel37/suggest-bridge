name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cea61d8780248a0ef78435 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4db2e0100cada667aa # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.8,<1"
      - name: Ruff check
        run: ruff check bot tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cea61d8780248a0ef78435 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4db2e0100cada667aa # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  release-zip:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cea61d8780248a0ef78435 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4db2e0100cada667aa # v5.6.0
        with:
          python-version: "3.12"
      - name: Build zip
        run: |
          pip install -r requirements.txt
          python -c "from pathlib import Path; from bot.core.pack_dist import build_suggest_bot_zip; build_suggest_bot_zip(Path('dist'))"
      - name: Upload release asset
        uses: softprops/action-gh-release@da05d5520f8750c3745761b7e8355e9c3b0fa4 # v2.2.2
        with:
          files: dist/suggest-bot-*.zip
